<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Presióname</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .fondo {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at top, rgba(0,102,255,0.2) 0%, transparent 60%),
        radial-gradient(ellipse at bottom, rgba(0,255,247,0.1) 0%, transparent 60%),
        #000;
      z-index: 0;
    }

    .grid {
      position: fixed;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(0,229,204,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,204,0.06) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: moverGrid 6s linear infinite;
      z-index: 0;
    }
    @keyframes moverGrid {
      from { background-position: 0 0; }
      to   { background-position: 0 40px; }
    }

    .linea {
      position: fixed;
      width: 2px;
      height: 80px;
      border-radius: 2px;
      animation: caer 3s linear infinite;
      opacity: 0;
      z-index: 1;
    }
    @keyframes caer {
      0%   { transform: translateY(-100px); opacity: 0; }
      20%  { opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translateY(110vh); opacity: 0; }
    }

    .botones {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 20px;
    }

    .boton {
      padding: 14px 40px;
      font-family: 'Orbitron', monospace;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      color: #00FFF7;
      background: transparent;
      border: 2px solid #00E5CC;
      border-radius: 4px;
      box-shadow:
        0 0 10px #00E5CC,
        0 0 30px rgba(0,229,204,0.3),
        inset 0 0 10px rgba(0,255,247,0.05);
      transition: all 0.2s;
      text-shadow: 0 0 8px #00FFF7;
    }
    .boton:hover {
      background: rgba(0,255,247,0.08);
      color: #E0FFFF;
      border-color: #00FFF7;
      box-shadow:
        0 0 20px #00FFF7,
        0 0 60px rgba(0,255,247,0.4),
        inset 0 0 20px rgba(0,255,247,0.1);
      text-shadow: 0 0 12px #00FFF7, 0 0 30px #00C4A0;
    }
    .boton:active {
      transform: scale(0.96);
      color: #0066FF;
      border-color: #0066FF;
      box-shadow:
        0 0 20px #0066FF,
        0 0 60px rgba(0,102,255,0.5);
      text-shadow: 0 0 12px #0066FF;
    }
  </style>
</head>
<body>
  <div class="fondo"></div>
  <div class="grid"></div>

  <div class="botones">
    <button class="boton" onclick="presionar1()">Inicio</button>
    <button class="boton" onclick="presionar2()">Explorar</button>
    <button class="boton" onclick="presionar3()">Contacto</button>
  </div>

  <script>
    const colores = ['#00FFF7','#00E5CC','#0066FF','#00C4A0','#E0FFFF'];
    for (let i = 0; i < 12; i++) {
      const l = document.createElement('div');
      l.className = 'linea';
      l.style.left = (Math.random() * 100) + '%';
      l.style.animationDelay = (Math.random() * 3) + 's';
      l.style.animationDuration = (2 + Math.random() * 2) + 's';
      l.style.background = colores[Math.floor(Math.random() * colores.length)];
      l.style.boxShadow = `0 0 6px ${colores[Math.floor(Math.random() * colores.length)]}`;
      document.body.appendChild(l);
    }

    function presionar1() { window.location.href = "inicio.html"; }
    function presionar2() { window.location.href = "explorar.html"; }
    function presionar3() { window.location.href = "contacto.html"; }
  </script>
</body>
</html>
